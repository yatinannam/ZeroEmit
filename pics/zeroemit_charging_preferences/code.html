<!DOCTYPE html>

<html lang="en"><head>

<style>
        .material-symbols-outlined {
          font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen font-body-lg flex flex-col antialiased">
<!-- TopAppBar -->
<header class="bg-surface flex justify-between items-center px-container-padding h-touch-target-min w-full max-w-md mx-auto sticky top-0 z-40">
<button aria-label="Location" class="text-on-surface-variant hover:opacity-80 transition-opacity scale-95 active:transition-transform flex items-center justify-center w-touch-target-min h-touch-target-min -ml-2">
<span class="material-symbols-outlined text-[24px]">location_on</span>
</button>
<div class="font-headline-md text-headline-md-mobile text-primary tracking-tight">ZeroEmit</div>
<button aria-label="Profile" class="text-primary hover:opacity-80 transition-opacity scale-95 active:transition-transform flex items-center justify-center w-touch-target-min h-touch-target-min -mr-2">
<span class="material-symbols-outlined text-[24px]">account_circle</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-md mx-auto px-container-padding pt-md pb-[120px]">
<!-- Header Section -->
<div class="mb-xl">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-xs">Charging Preferences</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">These preferences help ZeroEmit recommend windows that are practical for your schedule.</p>
</div>
<!-- Form Section -->
<form class="flex flex-col gap-lg">
<!-- Location Input -->
<div class="flex flex-col">
<label class="font-label-caps text-label-caps text-on-surface-variant mb-xs" for="location">Location</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline-variant">home_pin</span>
<input class="w-full h-[56px] pl-10 pr-sm rounded-xl border border-outline-variant/30 bg-surface-lowest text-body-lg font-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all shadow-[0px_4px_20px_rgba(23,33,23,0.02)]" id="location" type="text" value="Home Garage"/>
</div>
</div>
<!-- Typical Charging Time -->
<div class="flex flex-col">
<label class="font-label-caps text-label-caps text-on-surface-variant mb-xs" for="charge-time">Typical charging time</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline-variant">ev_charger</span>
<select class="w-full h-[56px] pl-10 pr-sm rounded-xl border border-outline-variant/30 bg-surface-lowest text-body-lg font-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary appearance-none transition-all shadow-[0px_4px_20px_rgba(23,33,23,0.02)]" id="charge-time">
<option value="2">2 Hours</option>
<option selected="" value="4">4 Hours</option>
<option value="6">6 Hours</option>
<option value="8">8+ Hours (Overnight)</option>
</select>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 text-outline pointer-events-none">expand_more</span>
</div>
</div>
<!-- Latest Departure -->
<div class="flex flex-col">
<label class="font-label-caps text-label-caps text-on-surface-variant mb-xs" for="departure-time">Latest departure</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline-variant">schedule</span>
<input class="w-full h-[56px] pl-10 pr-sm rounded-xl border border-outline-variant/30 bg-surface-lowest text-body-lg font-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all shadow-[0px_4px_20px_rgba(23,33,23,0.02)]" id="departure-time" type="time" value="07:30"/>
</div>
</div>
<!-- Preferred Days -->
<div class="flex flex-col">
<label class="font-label-caps text-label-caps text-on-surface-variant mb-xs">Preferred days</label>
<div class="flex justify-between items-center bg-surface-container-low p-sm rounded-xl border border-outline-variant/20 shadow-[0px_4px_20px_rgba(23,33,23,0.02)]">
<!-- Active Day -->
<button class="w-10 h-10 rounded-full bg-primary text-on-primary font-body-sm text-body-sm flex items-center justify-center transition-transform active:scale-95 shadow-md" type="button">M</button>
<button class="w-10 h-10 rounded-full bg-primary text-on-primary font-body-sm text-body-sm flex items-center justify-center transition-transform active:scale-95 shadow-md" type="button">T</button>
<button class="w-10 h-10 rounded-full bg-primary text-on-primary font-body-sm text-body-sm flex items-center justify-center transition-transform active:scale-95 shadow-md" type="button">W</button>
<button class="w-10 h-10 rounded-full bg-primary text-on-primary font-body-sm text-body-sm flex items-center justify-center transition-transform active:scale-95 shadow-md" type="button">T</button>
<button class="w-10 h-10 rounded-full bg-primary text-on-primary font-body-sm text-body-sm flex items-center justify-center transition-transform active:scale-95 shadow-md" type="button">F</button>
<!-- Inactive Day -->
<button class="w-10 h-10 rounded-full bg-surface text-on-surface-variant font-body-sm text-body-sm flex items-center justify-center transition-transform active:scale-95 border border-outline-variant/30" type="button">S</button>
<button class="w-10 h-10 rounded-full bg-surface text-on-surface-variant font-body-sm text-body-sm flex items-center justify-center transition-transform active:scale-95 border border-outline-variant/30" type="button">S</button>
</div>
</div>
<!-- Smart Automation Toggle -->
<div class="flex items-center justify-between p-md bg-surface-container-lowest rounded-xl border border-outline-variant/30 mt-sm shadow-[0px_4px_20px_rgba(23,33,23,0.02)]">
<div>
<div class="font-body-lg text-body-lg text-on-surface font-semibold">Auto-Schedule</div>
<div class="font-body-sm text-body-sm text-on-surface-variant mt-1">Allow app to start charging automatically</div>
</div>
<!-- Custom Toggle Switch -->
<label class="relative inline-flex items-center cursor-pointer scale-90">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-14 h-8 bg-surface-variant rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[4px] after:left-[4px] after:bg-white after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
<!-- CTA Button -->
<button class="w-full h-[48px] bg-primary text-on-primary font-body-lg text-body-lg font-semibold rounded-full mt-lg hover:opacity-90 transition-opacity active:scale-[0.98] flex items-center justify-center shadow-md" type="button">
                Save preferences
            </button>
</form>
</main>
<!-- BottomNavBar -->
<nav class="bg-surface fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-[84px] pb-[20px] pt-[12px] px-4 shadow-[0px_-4px_20px_rgba(23,33,23,0.04)] rounded-t-xl">
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-90 w-16 group">
<span class="material-symbols-outlined mb-1 group-hover:scale-110 transition-transform">home</span>
<span class="font-label-caps text-label-caps">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-90 w-16 group">
<span class="material-symbols-outlined mb-1 group-hover:scale-110 transition-transform">query_stats</span>
<span class="font-label-caps text-label-caps">Forecast</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-90 w-16 group">
<span class="material-symbols-outlined mb-1 group-hover:scale-110 transition-transform">history</span>
<span class="font-label-caps text-label-caps">Log</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-90 w-16 group">
<span class="material-symbols-outlined mb-1 group-hover:scale-110 transition-transform">workspace_premium</span>
<span class="font-label-caps text-label-caps">Rewards</span>
</button>
<!-- Active Tab: Profile -->
<button class="flex flex-col items-center justify-center text-primary relative after:content-[''] after:w-1 after:h-1 after:bg-primary after:rounded-full after:mt-1 active:scale-90 transition-all duration-200 w-16 group">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-label-caps text-label-caps">Profile</span>
</button>
</nav>
</body></html>
